<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">墨读英语 Moread</title>
  <desc id="hero-desc">纯静态英语精读站：点词查义、划句翻译、批注笔记，以及 2774 道单选题的即时判分练习，部署于 GitHub Pages。</desc>

  <defs>
    <pattern id="ruled-lines" width="1200" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 39.5 H1200" stroke="#d2c3a9" stroke-width="1" opacity="0.22"/>
    </pattern>
  </defs>

  <!-- 背景：纸感 + 行线 -->
  <rect width="1200" height="420" rx="26" fill="#f6f1e7"/>
  <rect width="1200" height="420" rx="26" fill="url(#ruled-lines)"/>
  <rect x="1.5" y="1.5" width="1197" height="417" rx="24.5" fill="none" stroke="#e4dac8" stroke-width="1.5"/>

  <!-- ============ 左：标题区 ============ -->
  <g id="title-block">
    <text x="64" y="90" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" letter-spacing="2.5" fill="#736a5e">MOREAD ENGLISH · 静态精读站 · GITHUB PAGES</text>

    <text x="62" y="158" font-family="Georgia, 'Songti SC', 'Noto Serif SC', SimSun, serif" font-size="64" font-weight="700" fill="#27231e">墨读英语</text>
    <text x="340" y="156" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#736a5e">Moread English</text>

    <text x="62" y="205" font-family="Georgia, 'Songti SC', 'Noto Serif SC', SimSun, serif" font-size="27" fill="#27231e">把每一篇真题，读成自己的<tspan fill="#b3462f" font-weight="700">语感</tspan>。</text>
    <path d="M386 214 q30 8 62 0" stroke="#b3462f" stroke-width="2.5" fill="none" opacity="0.55" stroke-linecap="round"/>

    <!-- 能力标签 -->
    <g font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#4f463a">
      <rect x="62" y="238" width="102" height="32" rx="16" fill="#fffcf6" stroke="#d2c3a9"/>
      <text x="113" y="259" text-anchor="middle">点词查义</text>
      <rect x="174" y="238" width="102" height="32" rx="16" fill="#fffcf6" stroke="#d2c3a9"/>
      <text x="225" y="259" text-anchor="middle">划句翻译</text>
      <rect x="286" y="238" width="102" height="32" rx="16" fill="#fffcf6" stroke="#d2c3a9"/>
      <text x="337" y="259" text-anchor="middle">批注笔记</text>
      <rect x="398" y="238" width="128" height="32" rx="16" fill="#fffcf6" stroke="#d2c3a9"/>
      <text x="462" y="259" text-anchor="middle">2774 道单选</text>
    </g>

    <!-- 在线入口 -->
    <rect x="62" y="300" width="212" height="42" rx="21" fill="#b3462f"/>
    <text x="168" y="327" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600" fill="#fffcf6">▶ 免费在线使用</text>
    <text x="62" y="378" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" fill="#4f463a">cheshiping.github.io/English-practicing</text>
  </g>

  <!-- ============ 右：项目实证 ============ -->
  <g id="project-proof" transform="translate(700 44)">
    <!-- 真文精读卡 -->
    <rect x="0" y="0" width="436" height="196" rx="16" fill="#fffcf6" stroke="#e4dac8"/>
    <text x="24" y="38" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" letter-spacing="2" fill="#736a5e">PASSAGE · 01</text>
    <text x="24" y="76" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#27231e">Why the Body Needs Sleep</text>
    <g font-family="Georgia, serif" font-size="17" fill="#4f463a">
      <text x="24" y="116">After a busy day of work and play, the body</text>
      <text x="24" y="141">needs to rest. Sleep is necessary for good</text>
      <rect x="21" y="152" width="74" height="24" rx="4" fill="#f5e2da"/>
      <text x="24" y="166"><tspan fill="#8e3422" font-weight="600">health</tspan>. It restores both body and mind.</text>
    </g>

    <!-- 精读印章 -->
    <g transform="rotate(12 372 44)">
      <circle cx="372" cy="44" r="30" fill="none" stroke="#b3462f" stroke-width="1.8" opacity="0.85"/>
      <circle cx="372" cy="44" r="24" fill="none" stroke="#b3462f" stroke-width="0.8" opacity="0.45"/>
      <text x="372" y="51" text-anchor="middle" font-family="'Songti SC', 'Noto Serif SC', SimSun, serif" font-size="17" font-weight="700" fill="#b3462f">精读</text>
    </g>

    <!-- 点词卡 -->
    <rect x="286" y="176" width="150" height="74" rx="10" fill="#27231e" opacity="0.07"/>
    <rect x="283" y="173" width="150" height="74" rx="10" fill="#fffcf6" stroke="#e4dac8"/>
    <text x="299" y="199" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#27231e">prepare</text>
    <text x="299" y="219" font-family="-apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14" fill="#736a5e">/prɪˈpeə(r)/ v. 准备</text>
    <text x="299" y="238" font-family="-apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14" fill="#b3462f">＋ 加入生词本</text>

    <!-- 即时判分练习条 -->
    <rect x="0" y="252" width="436" height="78" rx="16" fill="#fffcf6" stroke="#e4dac8"/>
    <text x="24" y="280" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600" fill="#27231e">单选练习 · 答一题判一题</text>
    <g font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16">
      <rect x="24" y="292" width="120" height="26" rx="13" fill="#e4eee7"/>
      <text x="84" y="310" text-anchor="middle" fill="#3e6b57" font-weight="600">A. Sleep ✓</text>
      <rect x="154" y="292" width="120" height="26" rx="13" fill="#f5e2da"/>
      <text x="214" y="310" text-anchor="middle" fill="#b23a2e" font-weight="600">B. Rest ✗</text>
      <text x="290" y="310" fill="#736a5e">错题自动入本</text>
    </g>
  </g>
</svg>
